name: monitoring

services:
  crowdsec-ui:
    image: ghcr.io/theduffman85/crowdsec-web-ui:2026.7.8@sha256:2d42a65294b4a3031e16809425c001de45ec7923f16c54c6431d7ac31636b1b7
    container_name: crowdsec_ui
    volumes:
      - ${APPS_FOLDER}/monitoring/crowdsec:/app/data
    environment:
      TZ: Europe/Berlin
      CROWDSEC_URL: http://crowdsec:8080
      CROWDSEC_USER: crowdsec-ui
      CROWDSEC_PASSWORD: ${CROWDSEC_API_KEY}
    networks:
      traefik:
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.crowdsec_ui.rule=Host(`crowdsec.${DOMAIN}`)
      - traefik.http.routers.crowdsec_ui.entrypoints=websecure
      - traefik.http.routers.crowdsec_ui.middlewares=authelia@docker
      - traefik.http.routers.crowdsec_ui.service=crowdsec_ui
      - traefik.http.services.crowdsec_ui.loadbalancer.server.port=3000
    user: 568:568
    security_opt:
      - no-new-privileges:true

  dozzle:
    image: docker.io/amir20/dozzle:v10.6.7@sha256:43d933ebda116990c920e054d68a1aed286ab01fd31657983c53bbdf46cc0aa8
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      traefik:
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.dozzle.rule=Host(`dozzle.${DOMAIN}`)
      - traefik.http.routers.dozzle.entrypoints=websecure
      - traefik.http.routers.dozzle.middlewares=authelia@docker
      - traefik.http.routers.dozzle.service=dozzle
      - traefik.http.services.dozzle.loadbalancer.server.port=8080
    security_opt:
      - no-new-privileges:true

  fluentbit:
    image: docker.io/fluent/fluent-bit:5.0.9@sha256:ccda4cbd0f87be1e04cc1d5425bc84a6669051d4ac93a6b7a053c3ba9832aa14
    container_name: fluentbit
    volumes:
      - ./config/fluentbit/config.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      - ${APPS_FOLDER}/monitoring/fluentbit:/fluent-bit/etc/data:ro
      # Logs
      - ${APPS_FOLDER}/network/traefik/logs:/var/log/traefik:ro
    networks:
      metrics_internal:
    command:
      ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.yaml"]
    restart: unless-stopped
    user: 568:568
    security_opt:
      - no-new-privileges:true

  grafana:
    image: docker.io/grafana/grafana:13.1.0-slim@sha256:39fc2aa468222bf25ea7033187aac37c669128937e6703371f27e4da85afdcbb
    container_name: grafana
    volumes:
      - ${APPS_FOLDER}/monitoring/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
    environment:
      TZ: Europe/Berlin
      GF_PLUGINS_PREINSTALL: victoriametrics-logs-datasource
    networks:
      metrics_internal:
      traefik:
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.middlewares=authelia@docker
      - traefik.http.routers.grafana.service=grafana
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    user: 568:568
    security_opt:
      - no-new-privileges:true

  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28
    container_name: homepage
    volumes:
      - ./config/homepage/widgets.yaml:/app/config/widgets.yaml
      - ./config/homepage/services.yaml:/app/config/services.yaml
      - ./config/homepage/settings.yaml:/app/config/settings.yaml
      - ./config/homepage/bookmarks.yaml:/app/config/bookmarks.yaml
    environment:
      PUID: 568
      PGID: 568
      TZ: Europe/Berlin
      HOMEPAGE_ALLOWED_HOSTS: homepage.${DOMAIN}
      HOMEPAGE_VAR_DOMAIN: ${DOMAIN}
    env_file:
      - homepage.env
    networks:
      traefik:
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`homepage.${DOMAIN}`)
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.middlewares=authelia@docker
      - traefik.http.routers.homepage.service=homepage
      - traefik.http.services.homepage.loadbalancer.server.port=3000
    security_opt:
      - no-new-privileges:true

  scrutiny:
    image: ghcr.io/analogj/scrutiny:v0.9.2-omnibus@sha256:f5bf4878381fcfe63bf61b96ff6f91de8b1b8c187ec0e86c65309946fa359e2e
    container_name: scrutiny
    volumes:
      - /run/udev:/run/udev:ro
      - ${APPS_FOLDER}/monitoring/scrutiny/config:/opt/scrutiny/config
      - ${APPS_FOLDER}/monitoring/scrutiny/data:/opt/scrutiny/influxdb
    networks:
      traefik:
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.scrutiny.rule=Host(`scrutiny.${DOMAIN}`)
      - traefik.http.routers.scrutiny.entrypoints=websecure
      - traefik.http.routers.scrutiny.middlewares=authelia@docker
      - traefik.http.routers.scrutiny.service=scrutiny
      - traefik.http.services.scrutiny.loadbalancer.server.port=8080
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    devices:
      - /dev/sda
      - /dev/sdb
      - /dev/sdc
      - /dev/sdd
      - /dev/sde
      - /dev/sdf
      - /dev/sdg
      - /dev/sdh
      - /dev/nvme0
    security_opt:
      - no-new-privileges:true

  victorialogs:
    image: docker.io/victoriametrics/victoria-logs:v1.51.0@sha256:e16dd33a95623cc21730cf5285344ed9f97419eeaff7d24b039c135beb85ee7e
    container_name: victorialogs
    volumes:
      - ${APPS_FOLDER}/monitoring/victorialogs:/vlogs
    networks:
      metrics_internal:
    command: --storageDataPath=/vlogs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9428/health"]
      interval: 1s
      timeout: 1s
      retries: 10
    user: 568:568
    security_opt:
      - no-new-privileges:true

  vmauth:
    image: docker.io/victoriametrics/vmauth:v1.147.0@sha256:93ff53c9ce2b1a9e54064b5158657de141588337e95a6bce7928dd205c73ce8d
    container_name: vmauth
    depends_on:
      victorialogs:
        condition: service_healthy
    volumes:
      - ./config/vmauth:/etc/vmauth
    networks:
      metrics_internal:
    command: -auth.config=/etc/vmauth/vmauth.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8427/health"]
      interval: 1s
      timeout: 1s
      retries: 10
    user: 568:568
    security_opt:
      - no-new-privileges:true

networks:
  traefik:
    external: true
    name: traefik
  metrics_internal:
    external: false
    name: metrics_internal
    internal: true
