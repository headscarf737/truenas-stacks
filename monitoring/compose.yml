name: monitoring

services:
  beszel:
    image: ghcr.io/henrygd/beszel/beszel:0.21.1@sha256:8514a69d9bbbcb74f371a3205561ee231fc0289739cea64e8131f341d695b770
    container_name: beszel
    networks:
      traefik_internal:
    volumes:
      - ${APPS_FOLDER}/monitoring/beszel:/beszel_data
      - ${APPS_FOLDER}/monitoring/beszel/beszel_socket:/beszel_socket
    environment:
      TZ: Europe/Berlin
      APP_URL: https://beszel.${DOMAIN}
      TRUSTED_AUTH_HEADER: Remote-Email
      TRUSTED_PROXY_IPS: 172.31.255.254/32,fdd0:0:0:1000::fe/128
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.beszel.rule=Host(`beszel.${DOMAIN}`)
      - traefik.http.routers.beszel.entrypoints=websecure
      - traefik.http.routers.beszel.middlewares=authelia@docker
      - traefik.http.routers.beszel.service=beszel
      - traefik.http.services.beszel.loadbalancer.server.port=8090
    security_opt:
      - no-new-privileges:true

  beszel-agent:
    image: ghcr.io/henrygd/beszel/beszel-agent:0.21.1-alpine@sha256:4100e26f7b5e6ab89e73699b2366417795f5046ab36bc452daf1f105766b40a0
    container_name: beszel-agent
    volumes:
      - ${APPS_FOLDER}/monitoring/beszel-agent:/var/lib/beszel-agent
      - ${APPS_FOLDER}/monitoring/beszel/beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: Europe/Berlin
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_KEY}
    restart: unless-stopped
    network_mode: host
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    devices:
      - /dev/sda
      - /dev/sdb
      - /dev/sdc
      - /dev/sdd
      - /dev/sde
      - /dev/sdf
      - /dev/sdg
      - /dev/sdh
      - /dev/nvme0
      - /dev/zfs
    security_opt:
      - no-new-privileges:true

  crowdsec-ui:
    image: ghcr.io/theduffman85/crowdsec-web-ui:2026.10.10@sha256:f57568d27b2c7798155a638b9cb76302777a9dcf43d8026f344c17767589d694
    container_name: crowdsec_ui
    volumes:
      - ${APPS_FOLDER}/monitoring/crowdsec:/app/data
    environment:
      TZ: Europe/Berlin
      CROWDSEC_URL: http://crowdsec:8080
      CROWDSEC_USER: crowdsec-ui
      CROWDSEC_PASSWORD: ${CROWDSEC_API_KEY}
    networks:
      traefik_internal:
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.crowdsec_ui.rule=Host(`crowdsec.${DOMAIN}`)
      - traefik.http.routers.crowdsec_ui.entrypoints=websecure
      - traefik.http.routers.crowdsec_ui.middlewares=authelia@docker
      - traefik.http.routers.crowdsec_ui.service=crowdsec_ui
      - traefik.http.services.crowdsec_ui.loadbalancer.server.port=3000
    user: 568:568
    security_opt:
      - no-new-privileges:true

  dozzle:
    image: ghcr.io/amir20/dozzle:v11.3.4@sha256:8796ae7e1ecbe011482319cb7040e69aae91a0632b87bbe24b3f643e7455d94b
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      traefik_internal:
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.dozzle.rule=Host(`dozzle.${DOMAIN}`)
      - traefik.http.routers.dozzle.entrypoints=websecure
      - traefik.http.routers.dozzle.middlewares=authelia@docker
      - traefik.http.routers.dozzle.service=dozzle
      - traefik.http.services.dozzle.loadbalancer.server.port=8080
    security_opt:
      - no-new-privileges:true

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.6.0@sha256:3e38fe788223cb46a3ce1f046ef11667b40f7707fdca0dcbfa3f86c5c42bf1e8
    container_name: homepage
    volumes:
      - ./config/homepage/widgets.yaml:/app/config/widgets.yaml:ro
      - ./config/homepage/services.yaml:/app/config/services.yaml:ro
      - ./config/homepage/settings.yaml:/app/config/settings.yaml:ro
      - ./config/homepage/bookmarks.yaml:/app/config/bookmarks.yaml:ro
    environment:
      PUID: 568
      PGID: 568
      TZ: Europe/Berlin
      HOMEPAGE_ALLOWED_HOSTS: homepage.${DOMAIN}
      HOMEPAGE_VAR_DOMAIN: ${DOMAIN}
    env_file:
      - homepage.env
    networks:
      monitoring:
      traefik_internal:
        ipv4_address: 172.31.255.253
        ipv6_address: fdd0:0:0:1000::fd
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`homepage.${DOMAIN}`)
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.middlewares=authelia@docker
      - traefik.http.routers.homepage.service=homepage
      - traefik.http.services.homepage.loadbalancer.server.port=3000
    security_opt:
      - no-new-privileges:true

networks:
  monitoring:
    external: false
    name: monitoring
  traefik_internal:
    external: true
    name: traefik_internal
