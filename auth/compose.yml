name: auth

services:
  authelia:
    image: docker.io/authelia/authelia:4.39.19@sha256:0c824dcab1ae97c56bf673c5e77fe8cc6bcd400564555140cc8002a12c6b6463
    container_name: authelia
    volumes:
      - ./config/authelia:/config
      - ${APPS_FOLDER}/auth/authelia/secrets:/secrets:ro
      - ${APPS_FOLDER}/auth/authelia/keys:/keys:ro
      - ${APPS_FOLDER}/auth/authelia/db:/db
      # Logs
      - ${APPS_FOLDER}/auth/authelia/logs:/var/log/authelia/
    environment:
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      TZ: Europe/Berlin
      X_AUTHELIA_CONFIG_FILTERS: template
      DOMAIN: ${DOMAIN}
    env_file:
      - authelia.env
    networks:
      auth_internal:
        ipv4_address: 172.31.254.3
        ipv6_address: fdd0:0:0:fff::3
      default:
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=auth_internal
      - traefik.http.routers.authelia.rule=Host(`auth.${DOMAIN}`)
      - traefik.http.routers.authelia.entrypoints=websecure,websecure-pub
      - traefik.http.middlewares.authelia.forwardAuth.address=http://authelia:9091/api/authz/forward-auth
      # todo: deprecated, disable?
      - traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader=true
      - traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email
      - traefik.http.middlewares.authelia.forwardAuth.maxBodySize=104857600 # 100MB
      - traefik.http.middlewares.authelia.forwardAuth.maxResponseBodySize=104857600 # 100MB
    user: 568:568
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  lldap:
    image: ghcr.io/lldap/lldap:v0.6.3-alpine-rootless@sha256:ba2c50930ea998eefd5454aa678a7977448019248b1827da87d330df0b71c284
    container_name: lldap
    volumes:
      - ${APPS_FOLDER}/auth/lldap:/data
    environment:
      LLDAP_LDAP_BASE_DN: ${LDAP_BASE_DN}
      TZ: Europe/Berlin
    env_file:
      - lldap.env
    networks:
      auth_internal:
        ipv4_address: 172.31.254.4
        ipv6_address: fdd0:0:0:fff::4
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=auth_internal
      - traefik.http.routers.lldap.rule=Host(`lldap.${DOMAIN}`)
      - traefik.http.routers.lldap.entrypoints=websecure
      - traefik.http.routers.lldap.service=lldap
      - traefik.http.services.lldap.loadbalancer.server.port=17170
    user: 568:568
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  auth_internal:
    external: true
    name: auth_internal
