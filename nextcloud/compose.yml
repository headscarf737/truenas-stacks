name: nextcloud

services:
  collabora:
    image: docker.io/collabora/code:26.04.2.1.1@sha256:fece3a479b4ca57e7186d0c715155526170e337deef55bbbbbc79ee93b0e72e1
    container_name: collabora
    environment:
      PUID: 568
      PGID: 568
      TZ: Europe/Berlin
      password: ${COLLABORA_PASSWORD}
      username: ${COLLABORA_USERNAME}
      aliasgroup1: https://nextcloud.${DOMAIN}:443,http://nextcloud:80
      server_name: collabora.${DOMAIN}
      DONT_GEN_SSL_CERT: "YES"
      extra_params: |
        --o:ssl.enable=false \
        --o:ssl.termination=true \
        --o:logging.level=warning \
        --o:logging.level_startup=warning \
        --o:welcome.enable=false \
        --o:remote_font_config.url=https://nextcloud.${DOMAIN}/apps/richdocuments/settings/fonts.json \
    networks:
      nextcloud:
      traefik_internal:
    command: ["coolconfig generate-proof-key && /start-collabora-online.sh"]
    entrypoint: ["/bin/bash", "-c"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/9980 && echo -e 'GET /hosting/discovery HTTP/1.1\r\nHost: localhost:9980\r\n\r\n' >&3 && head -n 1 <&3 | grep '200 OK'",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.routers.collabora.rule=Host(`collabora.${DOMAIN}`)
      - traefik.http.routers.collabora.entrypoints=websecure,websecure-pub
      - traefik.http.routers.collabora.service=collabora
      - traefik.http.services.collabora.loadbalancer.server.port=9980
    cap_add:
      - MKNOD
      - SYS_ADMIN
      - SYS_CHROOT
      - FOWNER
      - CHOWN

  mariadb:
    image: docker.io/library/mariadb:11.8.8@sha256:efb4959ef2c835cd735dbc388eb9ad6aab0c78dd64febcd51bc17481111890c4
    container_name: nextcloud-db
    volumes:
      - ${APPS_FOLDER}/nextcloud/db:/var/lib/mysql
    environment:
      TZ: Europe/Berlin
      MYSQL_RANDOM_ROOT_PASSWORD: true
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
    networks:
      nextcloud_internal:
    command: --transaction-isolation=READ-COMMITTED --innodb_read_only_compressed=OFF
    restart: unless-stopped
    user: 568:568

  nextcloud:
    image: docker.io/library/nextcloud:34.0.1@sha256:6444fc5450302534e850b4d23c05b5f06c7b0d25bd5ece716452061454699c58
    container_name: nextcloud
    depends_on:
      - collabora
      - mariadb
      - nextcloud-whiteboard
      - redis
    volumes:
      - ${CONTENT_FOLDER}/files:/var/www/html/data
      - ${APPS_FOLDER}/nextcloud/app:/var/www/html
      - ${APPS_FOLDER}/nextcloud/redis/redis-session.ini:/usr/local/etc/php/conf.d/redis-session.ini
      # Logs
      - ${APPS_FOLDER}/nextcloud/logs:/var/log/nextcloud
    environment:
      TZ: Europe/Berlin
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_HOST: mariadb
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      TRUSTED_PROXIES: 172.31.255.254/32 fdd0:0:0:1000::fe/128
      OVERWRITEHOST: nextcloud.${DOMAIN}
      OVERWRITECLIURL: https://nextcloud.${DOMAIN}
      OVERWRITEPROTOCOL: https
      NC_serverid: 1
    networks:
      nextcloud:
      nextcloud_internal:
      traefik_internal:
      auth_internal:
        ipv4_address: 172.31.254.6
        ipv6_address: fdd0:0:0:fff::6
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.nextcloud.rule=Host(`nextcloud.${DOMAIN}`)
      - traefik.http.routers.nextcloud.entrypoints=websecure,websecure-pub
      - traefik.http.routers.nextcloud.service=nextcloud
      - traefik.http.services.nextcloud.loadbalancer.server.port=80
    user: 568:568

  nextcloud-whiteboard:
    image: ghcr.io/nextcloud-releases/whiteboard:v1.5.9@sha256:b60b7633f90d106ac6922f9bc27e1a1ca2442488b740fefdae4c812f34e9cebc
    container_name: nextcloud-whiteboard
    environment:
      TZ: Europe/Berlin
      NEXTCLOUD_URL: https://nextcloud.${DOMAIN}
      JWT_SECRET_KEY: ${WHITEBOARD_SECRET}
    networks:
      nextcloud:
      traefik_internal:
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.nextcloud-whiteboard.rule=Host(`whiteboard.${DOMAIN}`)
      - traefik.http.routers.nextcloud-whiteboard.entrypoints=websecure,websecure-pub
      - traefik.http.routers.nextcloud-whiteboard.service=nextcloud-whiteboard
      - traefik.http.services.nextcloud-whiteboard.loadbalancer.server.port=3002
    user: 568:568

  redis:
    image: docker.io/library/redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    container_name: nextcloud-redis
    networks:
      nextcloud_internal:
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped

networks:
  nextcloud:
    external: false
    name: nextcloud
  nextcloud_internal:
    external: false
    name: nextcloud_internal
    internal: true
  traefik_internal:
    external: true
    name: traefik_internal
  auth_internal:
    external: true
    name: auth_internal
