name: nextcloud

services:
  collabora:
    image: docker.io/collabora/code:26.04.3.2.1@sha256:379b8f1fc955dd6d01ba24adf61d1b177048ddaae179ae8c1e6a6342daccb282
    container_name: collabora
    environment:
      PUID: 568
      PGID: 568
      TZ: Europe/Berlin
      password: ${COLLABORA_PASSWORD}
      username: ${COLLABORA_USERNAME}
      aliasgroup1: https://nextcloud.${DOMAIN}:443
      server_name: collabora.${DOMAIN}
      DONT_GEN_SSL_CERT: "YES"
      extra_params: |
        --o:ssl.enable=false \
        --o:ssl.termination=true \
        --o:logging.level=warning \
        --o:logging.level_startup=warning \
        --o:welcome.enable=false \
        --o:net.frame_ancestors=https://nextcloud.${DOMAIN} \
        --o:remote_font_config.url=https://nextcloud.${DOMAIN}/apps/richdocuments/settings/fonts.json \
    networks:
      nextcloud:
        ipv4_address: 172.31.253.2
        ipv6_address: fdd0:0:0:ffe::2
      traefik_internal:
    extra_hosts:
      - "nextcloud.${DOMAIN}:172.31.253.3"
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.collabora.rule=Host(`collabora.${DOMAIN}`)
      - traefik.http.routers.collabora.entrypoints=websecure,websecure-pub
      - traefik.http.routers.collabora.service=collabora
      - traefik.http.services.collabora.loadbalancer.server.port=9980
    cap_add:
      - MKNOD
      - SYS_ADMIN
      - SYS_CHROOT
      - FOWNER
      - CHOWN

  mariadb:
    image: docker.io/library/mariadb:11.8.9@sha256:79d59758afc91b89b120b0a8904d637f5a3b3e1c4900f29b740d6d46c72fef68
    container_name: nextcloud-db
    volumes:
      - ${APPS_FOLDER}/nextcloud/db:/var/lib/mysql
    environment:
      TZ: Europe/Berlin
      MYSQL_RANDOM_ROOT_PASSWORD: true
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
    networks:
      nextcloud_internal:
    command: --transaction-isolation=READ-COMMITTED --innodb_read_only_compressed=OFF
    restart: unless-stopped
    user: 568:568

  nextcloud:
    image: docker.io/library/nextcloud:34.0.4@sha256:a5ace30c695afe48c2c406e940ee7886a81e13fa382e57cd68b2416d1a66914c
    container_name: nextcloud
    depends_on:
      - collabora
      - mariadb
      - nextcloud-whiteboard
      - redis
    volumes:
      - ${CONTENT_FOLDER}/files:/var/www/html/data
      - ${APPS_FOLDER}/nextcloud/app:/var/www/html
      - ${APPS_FOLDER}/nextcloud/redis/redis-session.ini:/usr/local/etc/php/conf.d/redis-session.ini
      # Logs
      - ${APPS_FOLDER}/nextcloud/logs:/var/log/nextcloud
    environment:
      TZ: Europe/Berlin
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_HOST: mariadb
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      TRUSTED_PROXIES: 172.31.255.254/32 fdd0:0:0:1000::fe/128
      OVERWRITEHOST: nextcloud.${DOMAIN}
      OVERWRITECLIURL: https://nextcloud.${DOMAIN}
      OVERWRITEPROTOCOL: https
      NC_serverid: 1
    networks:
      nextcloud:
        ipv4_address: 172.31.253.3
        ipv6_address: fdd0:0:0:ffe::3
      nextcloud_internal:
      traefik_internal:
      auth_internal:
        ipv4_address: 172.31.254.6
        ipv6_address: fdd0:0:0:fff::6
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.nextcloud.rule=Host(`nextcloud.${DOMAIN}`)
      - traefik.http.routers.nextcloud.entrypoints=websecure,websecure-pub
      - traefik.http.routers.nextcloud.service=nextcloud
      - traefik.http.services.nextcloud.loadbalancer.server.port=80
    user: 568:568

  nextcloud-whiteboard:
    image: ghcr.io/nextcloud-releases/whiteboard:v2.0.0@sha256:059596633333d009890c64858f89f133ccd973a2e0823ad960a0cc05cf8657f1
    container_name: nextcloud-whiteboard
    environment:
      TZ: Europe/Berlin
      NEXTCLOUD_URL: https://nextcloud.${DOMAIN}
      JWT_SECRET_KEY: ${WHITEBOARD_SECRET}
    networks:
      nextcloud:
        ipv4_address: 172.31.253.4
        ipv6_address: fdd0:0:0:ffe::4
      traefik_internal:
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.nextcloud-whiteboard.rule=Host(`whiteboard.${DOMAIN}`)
      - traefik.http.routers.nextcloud-whiteboard.entrypoints=websecure,websecure-pub
      - traefik.http.routers.nextcloud-whiteboard.service=nextcloud-whiteboard
      - traefik.http.services.nextcloud-whiteboard.loadbalancer.server.port=3002
    user: 568:568

  redis:
    image: docker.io/library/redis:8.10.1-alpine@sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
    container_name: nextcloud-redis
    networks:
      nextcloud_internal:
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped

networks:
  nextcloud:
    external: false
    name: nextcloud
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.31.253.0/24
        - subnet: fdd0:0:0:ffe::/64
  nextcloud_internal:
    external: false
    name: nextcloud_internal
    internal: true
  traefik_internal:
    external: true
    name: traefik_internal
  auth_internal:
    external: true
    name: auth_internal
