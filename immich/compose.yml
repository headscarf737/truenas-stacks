name: immich

services:
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    volumes:
      - ${APPS_FOLDER}/immich/db:/var/lib/postgresql/data
    environment:
      TZ: Europe/Berlin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: --data-checksums
    networks:
      immich_internal:
    restart: unless-stopped
    user: 568:568
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.2@sha256:60dfcf266a9ef3b7376f5678e8c980d4fb61db5fc48c078fe8a326ab1535d60d
    container_name: immich_machine_learning
    volumes:
      - ${APPS_FOLDER}/immich/model-cache:/cache
      - ${APPS_FOLDER}/immich/model-dotcache:/.cache
      - ${APPS_FOLDER}/immich/model-config:/.config
    environment:
      TZ: Europe/Berlin
    networks:
      immich:
    restart: unless-stopped
    user: 568:568
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.2.2@sha256:79cc1623323d5894922686d8743b4780181428f98eecbfb58ce12c41ef02d1ea
    container_name: immich_server
    depends_on:
      - database
      - redis
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONTENT_FOLDER}/images:/data
    environment:
      TZ: Europe/Berlin
      IMMICH_TRUSTED_PROXIES: 172.31.255.254/32,fdd0:0:0:1000::fe/128
    env_file:
      - .env
    networks:
      immich:
      immich_internal:
      traefik_internal:
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.immich.rule=Host(`immich.${DOMAIN}`)
      - traefik.http.routers.immich.entrypoints=websecure
      - traefik.http.routers.immich.service=immich
      - traefik.http.routers.immich-pub.rule=Host(`immich.${DOMAIN}`)
      - traefik.http.routers.immich-pub.entrypoints=websecure-pub
      - traefik.http.routers.immich-pub.middlewares=immich-pub-basic-auth
      - traefik.http.routers.immich-pub.service=immich
      - traefik.http.middlewares.immich-pub-basic-auth.basicauth.users=${IMMICH_BASIC_AUTH_USERS}
      - traefik.http.services.immich.loadbalancer.server.port=2283
    user: 568:568
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  redis:
    image: ghcr.io/valkey-io/valkey:9.1.2-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
    container_name: immich_redis
    networks:
      immich_internal:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
    security_opt:
      - no-new-privileges:true

networks:
  immich:
    external: false
    name: immich
  immich_internal:
    external: false
    name: immich_internal
    internal: true
  traefik_internal:
    external: true
    name: traefik_internal
