name: immich

services:
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    volumes:
      - ${APPS_FOLDER}/immich/db:/var/lib/postgresql/data
    environment:
      TZ: Europe/Berlin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: --data-checksums
    networks:
      immich_internal:
    restart: unless-stopped
    user: 568:568
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.0.3@sha256:d76fe88b69282c09a97eac4f82dafa82cfd77bce274bc742591cde974f87dacb
    container_name: immich_machine_learning
    volumes:
      - ${APPS_FOLDER}/immich/model-cache:/cache
      - ${APPS_FOLDER}/immich/model-dotcache:/.cache
      - ${APPS_FOLDER}/immich/model-config:/.config
    environment:
      TZ: Europe/Berlin
    networks:
      immich:
    restart: unless-stopped
    user: 568:568
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.0.3@sha256:c716dc20f957aafd89fa9d284a2ec63e25c9e2d8d8e87c6197d540a3dce237db
    container_name: immich_server
    depends_on:
      - database
      - redis
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONTENT_FOLDER}/images:/data
    environment:
      TZ: Europe/Berlin
      IMMICH_TRUSTED_PROXIES: 172.31.255.254/32,fdd0:0:0:1000::fe/128
    env_file:
      - .env
    networks:
      immich:
      immich_internal:
      traefik_internal:
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.immich.rule=Host(`immich.${DOMAIN}`)
      - traefik.http.routers.immich.entrypoints=websecure
      - traefik.http.routers.immich.service=immich
      # - traefik.http.routers.immich-pub.rule=Host(`immich.${DOMAIN}`)
      # - traefik.http.routers.immich-pub.entrypoints=websecure-pub
      # TODO: add header auth middleware for pub router
      # - traefik.http.routers.immich-pub.service=immich
      - traefik.http.services.immich.loadbalancer.server.port=2283
    user: 568:568
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  redis:
    image: ghcr.io/valkey-io/valkey:9.1.0-alpine@sha256:c9b77919daeba2c02ad954d0c844cc4e7142069d177b89c5fd771f405daf9e02
    container_name: immich_redis
    networks:
      immich_internal:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
    security_opt:
      - no-new-privileges:true

networks:
  immich:
    external: false
    name: immich
  immich_internal:
    external: false
    name: immich_internal
    internal: true
  traefik_internal:
    external: true
    name: traefik_internal
