name: torrent

services:
  auditorr:
    image: ghcr.io/thrill-burn/auditorr:1.8.1@sha256:c5c1a3057da55070c89e73d551101931e3a2a091dec54897db21c625a8a4371c
    container_name: auditorr
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    volumes:
      - ${APPS_FOLDER}/torrent/auditorr:/app/data
      - ${MEDIA_FOLDER}:/data:ro
    environment:
      TZ: Europe/Berlin
      HOME: /tmp
    network_mode: service:gluetun
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.auditorr.rule=Host(`auditorr.${DOMAIN}`)
      - traefik.http.routers.auditorr.entrypoints=websecure
      - traefik.http.routers.auditorr.middlewares=authelia@docker
      - traefik.http.routers.auditorr.service=auditorr
      - traefik.http.services.auditorr.loadbalancer.server.port=8677
    user: 568:568
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  autobrr:
    image: ghcr.io/autobrr/autobrr:v1.90.0@sha256:72bb5fe5e8c73f85660f92502d9015b21b07156495f039b55864633b9f8b7a89
    container_name: autobrr
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    volumes:
      - ${APPS_FOLDER}/torrent/autobrr:/config
    environment:
      TZ: Europe/Berlin
      AUTOBRR__LOG_LEVEL: INFO
    network_mode: service:gluetun
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.autobrr.rule=Host(`autobrr.${DOMAIN}`)
      - traefik.http.routers.autobrr.entrypoints=websecure
      - traefik.http.routers.autobrr.middlewares=authelia@docker
      - traefik.http.routers.autobrr.service=autobrr
      - traefik.http.services.autobrr.loadbalancer.server.port=7474
    user: 568:568
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  gluetun:
    image: ghcr.io/qdm12/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: torrent-gluetun
    volumes:
      - ${APPS_FOLDER}/torrent/gluetun:/gluetun
    environment:
      PUID: 568
      PGID: 568
      TZ: Europe/Berlin
      UPDATER_PERIOD: 0
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"${GLUETUN_API_KEY}"}'
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WG_PRIV_KEY}
      SERVER_COUNTRIES: Switzerland
      BLOCK_MALICIOUS: off
    networks:
      torrent:
      traefik_internal:
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    hostname: torrent
    security_opt:
      - no-new-privileges:true

  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:release-v5.3.0@sha256:bd7e2d02cb1b52941bfe50feef87fce7f02db82aea7ba71259d3e6312a2f8fc8
    container_name: qbittorrent
    volumes:
      - ${MEDIA_FOLDER}/torrent:/data/torrent
      - ${APPS_FOLDER}/torrent/qbittorrent:/config
    environment:
      PUID: 568
      PGID: 568
      TZ: Europe/Berlin
      WEBUI_PORTS: 8080/tcp
      LIBTORRENT: v1
      VPN_ENABLED: true
      VPN_CONF: wg0
      VPN_PROVIDER: proton
      VPN_AUTO_PORT_FORWARD: true
      VPN_HEALTHCHECK_ENABLED: true
      VPN_NAMESERVERS: 1.1.1.1@853#cloudflare-dns.com
    networks:
      torrent:
      traefik_internal:
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${DOMAIN}`)
      - traefik.http.routers.qbittorrent.entrypoints=websecure
      - traefik.http.routers.qbittorrent.middlewares=authelia@docker
      - traefik.http.routers.qbittorrent.service=qbittorrent
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8080
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true

  qui:
    image: ghcr.io/autobrr/qui:v1.35.0@sha256:a5b2f5faf6388cce257137c88e4b189458fd799cf9119ed476c980e5a69341b2
    container_name: qui
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    volumes:
      - ${MEDIA_FOLDER}:/data
      - ${APPS_FOLDER}/torrent/qui:/config
    environment:
      TZ: Europe/Berlin
      QUI__AUTH_DISABLED: true
      QUI__I_ACKNOWLEDGE_THIS_IS_A_BAD_IDEA: true
      QUI__AUTH_DISABLED_ALLOWED_CIDRS: 127.0.0.1/32,172.31.255.254/32,fdd0:0:0:1000::fe/128,172.31.255.253/32,fdd0:0:0:1000::fd/128
    network_mode: service:gluetun
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.qui.rule=Host(`qui.${DOMAIN}`)
      - traefik.http.routers.qui.entrypoints=websecure
      - traefik.http.routers.qui.middlewares=authelia@docker
      - traefik.http.routers.qui.service=qui
      - traefik.http.services.qui.loadbalancer.server.port=7476
    user: 568:568
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  repollo:
    image: docker.io/uppollo/repollo:v0.12.0@sha256:9183cd3ff5fb72a80021ba2ddac92b186a19bc3fa44b0b0eac197acb5ab07638
    container_name: repollo
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    volumes:
      - ${MEDIA_FOLDER}/torrent:/data/torrent
      - ${APPS_FOLDER}/media/usenet:/data/usenet
      - ${APPS_FOLDER}/torrent/repollo:/home/repollo/.config/rePollo
    environment:
      TZ: Europe/Berlin
    network_mode: service:gluetun
    restart: unless-stopped
    user: 568:568
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  torrent:
    external: false
    name: torrent
  traefik_internal:
    external: true
    name: traefik_internal
