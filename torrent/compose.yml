name: torrent

services:
  auditorr:
    image: ghcr.io/thrill-burn/auditorr:1.7.1@sha256:c796aada842381595d098c80b3ad89bec2a41caea253b63a887b08fd95def994
    container_name: auditorr
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    volumes:
      - ${APPS_FOLDER}/torrent/auditorr:/app/data
      - ${MEDIA_FOLDER}:/data:ro
    environment:
      TZ: Europe/Berlin
      HOME: /tmp
    network_mode: service:gluetun
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.auditorr.rule=Host(`auditorr.${DOMAIN}`)
      - traefik.http.routers.auditorr.entrypoints=websecure
      - traefik.http.routers.auditorr.middlewares=authelia@docker
      - traefik.http.routers.auditorr.service=auditorr
      - traefik.http.services.auditorr.loadbalancer.server.port=8677
    user: 568:568
    security_opt:
      - no-new-privileges:true

  autobrr:
    image: ghcr.io/autobrr/autobrr:v1.85.0@sha256:f7594d15dfe9a59e7bbc4bce8aee437a1d440d60b350e2ee74331c0d4ec01928
    container_name: autobrr
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    volumes:
      - ${APPS_FOLDER}/torrent/autobrr:/config
    environment:
      TZ: Europe/Berlin
      AUTOBRR__LOG_LEVEL: INFO
    network_mode: service:gluetun
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.autobrr.rule=Host(`autobrr.${DOMAIN}`)
      - traefik.http.routers.autobrr.entrypoints=websecure
      - traefik.http.routers.autobrr.middlewares=authelia@docker
      - traefik.http.routers.autobrr.service=autobrr
      - traefik.http.services.autobrr.loadbalancer.server.port=7474
    user: 568:568
    security_opt:
      - no-new-privileges:true

  gluetun:
    image: ghcr.io/qdm12/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: torrent-gluetun
    volumes:
      - ${APPS_FOLDER}/torrent/gluetun:/gluetun
    environment:
      PUID: 568
      PGID: 568
      TZ: Europe/Berlin
      UPDATER_PERIOD: 0
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"${GLUETUN_API_KEY}"}'
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WG_PRIV_KEY}
      SERVER_COUNTRIES: Switzerland
      BLOCK_MALICIOUS: off
    networks:
      torrent:
      traefik_internal:
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    hostname: torrent

  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:release-v5.2.3@sha256:bf3a666adc150d078212e891c43fbc485394e82c6f8495e867a0bcb4ac32ee7d
    container_name: qbittorrent
    volumes:
      - ${MEDIA_FOLDER}/torrent:/data/torrent
      - ${APPS_FOLDER}/torrent/qbittorrent:/config
    environment:
      PUID: 568
      PGID: 568
      TZ: Europe/Berlin
      WEBUI_PORTS: 8080/tcp
      LIBTORRENT: v2
      VPN_ENABLED: true
      VPN_CONF: wg0
      VPN_PROVIDER: proton
      VPN_AUTO_PORT_FORWARD: true
      VPN_HEALTHCHECK_ENABLED: true
      VPN_NAMESERVERS: 1.1.1.1@853#cloudflare-dns.com
    networks:
      torrent:
      traefik_internal:
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${DOMAIN}`)
      - traefik.http.routers.qbittorrent.entrypoints=websecure
      - traefik.http.routers.qbittorrent.middlewares=authelia@docker
      - traefik.http.routers.qbittorrent.service=qbittorrent
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8080
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true

  qui:
    image: ghcr.io/autobrr/qui:v1.26.0@sha256:9969375e7375194b89eebc490bd16586b6ff4ff403042f6c4f0585eb0e775eaf
    container_name: qui
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    volumes:
      - ${MEDIA_FOLDER}:/data
      - ${APPS_FOLDER}/torrent/qui:/config
    environment:
      TZ: Europe/Berlin
      QUI__AUTH_DISABLED: true
      QUI__I_ACKNOWLEDGE_THIS_IS_A_BAD_IDEA: true
      QUI__AUTH_DISABLED_ALLOWED_CIDRS: 127.0.0.1/32,172.31.255.254/32,fdd0:0:0:1000::fe/128
    network_mode: service:gluetun
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.qui.rule=Host(`qui.${DOMAIN}`)
      - traefik.http.routers.qui.entrypoints=websecure
      - traefik.http.routers.qui.middlewares=authelia@docker
      - traefik.http.routers.qui.service=qui
      - traefik.http.services.qui.loadbalancer.server.port=7476
    user: 568:568
    security_opt:
      - no-new-privileges:true

  repollo:
    image: docker.io/uppollo/repollo:v0.8.1@sha256:d1a87b79a04a55325e3931c9e74671c3296fd0f48df18b85734099d54d811c29
    container_name: repollo
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    volumes:
      - ${MEDIA_FOLDER}/torrent:/data/torrent
      - ${APPS_FOLDER}/media/usenet:/data/usenet
      - ${APPS_FOLDER}/torrent/repollo:/home/repollo/.config/rePollo
    environment:
      TZ: Europe/Berlin
    network_mode: service:gluetun
    restart: unless-stopped
    user: 568:568
    security_opt:
      - no-new-privileges:true

networks:
  torrent:
    external: false
    name: torrent
  traefik_internal:
    external: true
    name: traefik_internal
